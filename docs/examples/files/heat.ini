; heat.ini: the case of a heat conduction run
title = cooling of a copper rod

[grid]
cells  = 64
length = 0.5          ; metres
origin = 0.0 0.0 0.0

[time]
dt    = 1.0e-4
steps = 2000
adaptive = .true.

[material]
name         = copper
conductivity = 401.0  ; W/(m K)
density      = 8960.0

[boundaries]
left  = 350.0
right = 300.0
; the probes, one value per line
probes = 0.1
         0.25
         0.4

[output]
format = vtk
fields = temperature flux
every  = 500
