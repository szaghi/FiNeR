name: Docs examples

# Project-owned workflow (not managed by `fobis scaffold`): the programs of docs/examples are built and run, and
# their snippets and outputs regenerated; the committed ones, included by the documentation, must match what the code
# produces.

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  docs-examples:
    name: docs examples / gfortran-16.2
    runs-on: ubuntu-latest
    # the toolchain image of ci.yml: gfortran 13.3 and 14.2 miscompile class(*) character arrays (wrong values written
    # by add), fixed in 14.3; the supported compilers are listed in docs/guide/installation.md
    container: ghcr.io/szaghi/fortran-toolchains:gnu-16.2

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Fetch dependencies
      run: fobis fetch

    - name: Build and run the examples
      run: bash scripts/docs_examples.sh

    - name: Check the committed snippets and outputs
      run: |
        git add --intent-to-add docs/examples
        git diff --exit-code -- docs/examples || {
          echo "::error::docs/examples is out of date: run 'bash scripts/docs_examples.sh' and commit the result"
          exit 1
        }
