name = "FiNeR"
version = "2.4.0"
author = "Stefano Zaghi"
copyright = "Copyright © 2015, Stefano Zaghi"
license = "Multiple licenses"
description = "Fortran INI ParseR and generator"
maintainer = "Stefano Zaghi"
homepage = "https://github.com/szaghi/FiNeR"

[dependencies]
BeFoR64 = { git = "https://github.com/szaghi/BeFoR64", branch = "master" }
FACE = { git = "https://github.com/szaghi/FACE", branch = "master" }
PENF = { git = "https://github.com/szaghi/PENF", branch = "master" }
StringiFor = { git = "https://github.com/szaghi/StringiFor", branch = "master" }

[library]
source-dir = "src/lib"

[install]
library = true

[build]
auto-executables = false
auto-examples = false
auto-tests = false

[[test]]
name = "finer_test_autotest"
source-dir = "src/tests"
main = "finer_test_autotest.f90"

