name = "FiNeR"
version = "2.3.0"
author = "Stefano Zaghi"
copyright = "Copyright © 2015, Stefano Zaghi"
license = "Multiple licenses"
description = "Fortran INI ParseR and generator"
maintainer = "Stefano Zaghi"
homepage = "https://github.com/szaghi/FiNeR"

# pinned to the commits of src/third_party/fobos.lock: update both together
[dependencies]
PENF = { git="https://github.com/szaghi/PENF.git", rev="592259d24ff39fa5e4b387d46286120ee60e7cff" }
StringiFor = { git="https://github.com/szaghi/StringiFor.git", rev="bd218de71aea6218edbfce7bb46c40b4668dc3e2" }

[library]
source-dir = "src/lib"

[install]
library = true

[build]
auto-executables = false
auto-examples = false
auto-tests = false

[[test]]
name = "finer_test_autotest"
source-dir = "src/tests"
main = "finer_test_autotest.f90"

[[test]]
name = "finer_test_complex"
source-dir = "src/tests"
main = "finer_test_complex.f90"

