name = "FiNeR"
version = "2.3.0"
author = "Stefano Zaghi"
copyright = "Copyright © 2015, Stefano Zaghi"
license = "Multiple licenses"
description = "Fortran INI ParseR and generator"
maintainer = "Stefano Zaghi"
homepage = "https://github.com/szaghi/FiNeR"

# pinned to the default-branch commits that `fobis fetch` resolves (fobos does not pin them, and
# src/third_party/fobos.lock is local and git-ignored): bump them when PENF or StringiFor move
[dependencies]
PENF = { git="https://github.com/szaghi/PENF.git", rev="d2bc5e10cc15aff633bdc88fffd643e8f0402cb2" }
StringiFor = { git="https://github.com/szaghi/StringiFor.git", rev="aaa7da6aefc92da0fb297c1b52ba71602923fbe2" }

[library]
source-dir = "src/lib"

[install]
library = true

[build]
auto-executables = false
auto-examples = false
auto-tests = false

[[test]]
name = "finer_test_autotest"
source-dir = "src/tests"
main = "finer_test_autotest.f90"

